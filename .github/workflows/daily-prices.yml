name: Daily prices

on:
  schedule:
    # Times are in UTC (Dhaka = UTC + 6). Days 0-4 = Sunday to Thursday.
    - cron: "45 8 * * 0-4"   # 2:45 PM Dhaka: today only, site marked preliminary (~3 PM)
    - cron: "0 10 * * 0-4"   # 4:00 PM Dhaka: last 5 days, final site (~4:10 PM)
  workflow_dispatch:
    inputs:
      mode:
        description: "today = today only, daily = last N days, fix = replace specific dates"
        type: choice
        options: [daily, today, fix]
        default: daily
      lookback_days:
        description: "daily: how many days to look back"
        default: "5"
      fix_start:
        description: "fix: start date (YYYY-MM-DD)"
        default: ""
      fix_end:
        description: "fix: end date (YYYY-MM-DD); leave empty for one day"
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

# Runs of both workflows wait for each other, so two updates never save at the same time.
concurrency:
  group: dse-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update prices
        run: |
          if [ "${{ github.event.schedule }}" = "45 8 * * 0-4" ] || [ "${{ inputs.mode }}" = "today" ]; then
            python update.py today
          elif [ "${{ inputs.mode }}" = "fix" ]; then
            python update.py fix ${{ inputs.fix_start }} ${{ inputs.fix_end }}
          else
            python update.py daily ${{ inputs.lookback_days || '5' }}
          fi

      - name: Save prices to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Prices update $(date -u +%F)"
          git pull --rebase
          git push

      # Prices are already saved above, so a failure from here on never loses data.
      - name: Score shares and build site
        run: |
          if [ "${{ github.event.schedule }}" = "45 8 * * 0-4" ] || [ "${{ inputs.mode }}" = "today" ]; then
            python analyze.py --run prelim
          else
            python analyze.py --run final
          fi

      - name: Save today's scores to repository
        run: |
          git add data/signals.csv
          git diff --cached --quiet || git commit -m "Signals $(date -u +%F)"
          git pull --rebase
          git push

      # Stamp this build on the page's CSS/JS links so browsers never mix old code with new data.
      - name: Version stamp
        run: sed -i "s/__V__/$(date -u +%Y%m%d%H%M%S)/g" site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
