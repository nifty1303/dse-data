name: Daily prices

on:
  schedule:
    # Times are in UTC (Dhaka = UTC + 6). Days 0-4 = Sunday to Thursday.
    - cron: "45 8 * * 0-4"   # 2:45 PM Dhaka: today only
    - cron: "0 10 * * 0-4"   # 4:00 PM Dhaka: last 5 days
  workflow_dispatch:
    inputs:
      mode:
        description: "today = today only, daily = last N days, fix = replace specific dates"
        type: choice
        options: [daily, today, fix]
        default: daily
      lookback_days:
        description: "daily: how many days to look back"
        default: "5"
      fix_start:
        description: "fix: start date (YYYY-MM-DD)"
        default: ""
      fix_end:
        description: "fix: end date (YYYY-MM-DD); leave empty for one day"
        default: ""

permissions:
  contents: write

# Runs of both workflows wait for each other, so two updates never save at the same time.
concurrency:
  group: dse-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update prices
        run: |
          if [ "${{ github.event.schedule }}" = "45 8 * * 0-4" ] || [ "${{ inputs.mode }}" = "today" ]; then
            python update.py today
          elif [ "${{ inputs.mode }}" = "fix" ]; then
            python update.py fix ${{ inputs.fix_start }} ${{ inputs.fix_end }}
          else
            python update.py daily ${{ inputs.lookback_days || '5' }}
          fi

      - name: Save to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Prices update $(date -u +%F)"
          git pull --rebase
          git push
